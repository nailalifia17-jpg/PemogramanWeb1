<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">
    <!-- Header / Navbar -->
    <header class="navbar navbar-expand-lg navbar-dark bg-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container my-4">
        <section class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <h2 class="card-title text-custom fw-bold mb-3">Tambah Buku</h2>
                <form style="max-width: 400px;">
                    <div class="mb-3">
                        <label for="judul" class="form-label fw-semibold text-secondary">Judul</label>
                        <input type="text" class="form-control" id="judul" name="judul" required>
                    </div>
                    <div class="mb-3">
                        <label for="pengarang" class="form-label fw-semibold text-secondary">Pengarang</label>
                        <input type="text" class="form-control" id="pengarang" name="pengarang" required>
                    </div>
                    <div class="mb-3">
                        <label for="tahun" class="form-label fw-semibold text-secondary">Tahun Terbit</label>
                        <input type="number" class="form-control" id="tahun" name="tahun" min="1900" max="2026" required>
                    </div>
                    <div class="mb-3">
                        <label for="isbn" class="form-label fw-semibold text-secondary">ISBN</label>
                        <input type="text" class="form-control" id="isbn" name="isbn">
                    </div>
                    <div class="mb-3">
                        <label for="stok" class="form-label fw-semibold text-secondary">Stok</label>
                        <input type="number" class="form-control" id="stok" name="stok" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label for="kategori" class="form-label fw-semibold text-secondary">Kategori</label>
                        <select class="form-select" id="kategori" name="kategori">
                            <option value="fiksi">Fiksi</option>
                            <option value="non-fiksi">Non-Fiksi</option>
                            <option value="referensi">Referensi</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-submit rounded-pill px-4 text-white fw-bold">Simpan</button>
                </form>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center text-secondary py-3">
        <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3 (Bootstrap)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

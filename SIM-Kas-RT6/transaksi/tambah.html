<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM Kas RT 6 | Tambah Transaksi</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIM Kas RT 6</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Transaksi</a></li>
                <li><a href="tambah.html">Tambah Transaksi</a></li>
                <li><a href="../warga/list.html">Daftar Warga</a></li>
                <li><a href="../laporan/index.html">Laporan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Transaksi Kas</h2>
            <form>
                <p>
                    <label for="tanggal">Tanggal</label><br>
                    <input type="date" id="tanggal" name="tanggal" required>
                </p>
                <p>
                    <label for="keterangan">Keterangan</label><br>
                    <input type="text" id="keterangan" name="keterangan" placeholder="Contoh: Iuran warga bulan Agustus" required>
                </p>
                <p>
                    <label for="jenis">Jenis Transaksi</label><br>
                    <select id="jenis" name="jenis" required>
                        <option value="masuk">Kas Masuk</option>
                        <option value="keluar">Kas Keluar</option>
                    </select>
                </p>
                <p>
                    <label for="jumlah">Jumlah (Rp)</label><br>
                    <input type="number" id="jumlah" name="jumlah" min="0" step="1000" required>
                </p>
                <p>
                    <label>Metode Pembayaran</label><br>
                    <span class="radio-group">
                        <label class="radio-label"><input type="radio" name="metode" value="tunai" checked> Tunai</label>
                        <label class="radio-label"><input type="radio" name="metode" value="transfer"> Transfer</label>
                    </span>
                </p>
                <p>
                    <label for="catatan">Catatan (opsional)</label><br>
                    <textarea id="catatan" name="catatan" rows="3" placeholder="Contoh: pembayaran dilakukan oleh Bpk. RT langsung"></textarea>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIM Kas RT 6</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM Kas RT 6 | Tambah Warga</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIM Kas RT 6</h1>
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../transaksi/list.html">Daftar Transaksi</a></li>
                <li><a href="list.html">Daftar Warga</a></li>
                <li><a href="tambah.html">Tambah Warga</a></li>
                <li><a href="../laporan/index.html">Laporan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Warga</h2>
            <form>
                <p>
                    <label for="nama">Nama Kepala Keluarga</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="no_kk">No. KK</label><br>
                    <input type="text" id="no_kk" name="no_kk" required>
                </p>
                <p>
                    <label for="alamat">Alamat</label><br>
                    <input type="text" id="alamat" name="alamat" required>
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <label>Status Kependudukan</label><br>
                    <span class="radio-group">
                        <label class="radio-label"><input type="radio" name="status" value="aktif" checked> Aktif</label>
                        <label class="radio-label"><input type="radio" name="status" value="pindah"> Pindah</label>
                    </span>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIM Kas RT 6</p>
    </footer>
</body>
</html>

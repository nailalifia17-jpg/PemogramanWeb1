<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yayasan Rumah Quran | Tambah Transaksi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-xl navbar-dark bg-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand brand" href="../index.html">
                <img src="../assets/images/logo-rq.png" alt="Logo Yayasan Rumah Quran">
                Yayasan Rumah Quran
            </a>
            <button class="navbar-toggler" type="button" aria-controls="navbarNav" aria-expanded="false" aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Transaksi</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card">
            <h1 class="section-title">Tambah Transaksi</h1>
            <form id="form-tambah" class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="tanggal" class="form-label">Tanggal</label>
                    <input type="date" class="form-control" id="tanggal" name="tanggal" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="jenis" class="form-label">Jenis Transaksi</label>
                    <select class="form-select" id="jenis" name="jenis" required>
                        <option value="">Pilih jenis transaksi</option>
                        <option value="masuk">Pemasukan</option>
                        <option value="keluar">Pengeluaran</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label for="kategori" class="form-label">Kategori</label>
                    <input type="text" class="form-control" id="kategori" name="kategori" placeholder="Contoh: Infaq" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="jumlah" class="form-label">Jumlah (Rp)</label>
                    <input type="number" class="form-control" id="jumlah" name="jumlah" min="1" step="1" placeholder="Contoh: 100000" required>
                </div>
                <div class="col-12">
                    <label for="keterangan" class="form-label">Keterangan</label>
                    <input type="text" class="form-control" id="keterangan" name="keterangan" maxlength="255" placeholder="Keterangan transaksi" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="metode" class="form-label">Metode Pembayaran</label>
                    <select class="form-select" id="metode" name="metode" required>
                        <option value="tunai">Tunai</option>
                        <option value="transfer">Transfer</option>
                    </select>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-submit rounded-pill px-4 text-white fw-bold">Simpan</button>
                </div>
            </form>
            <p class="form-feedback text-success fw-semibold mt-3 mb-0" role="status" hidden>Form valid. Pada Jobsheet 6, data belum disimpan.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Yayasan Rumah Quran</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>

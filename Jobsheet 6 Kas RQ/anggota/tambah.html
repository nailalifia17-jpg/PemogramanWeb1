
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yayasan Rumah Quran | Tambah Anggota</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-xl navbar-dark bg-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand brand" href="../index.html">
                <img src="../assets/images/logo-rq.png"
                     alt="Logo Yayasan Rumah Quran">
                Yayasan Rumah Quran
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>

            <nav class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../transaksi/list.html">
                            Daftar Transaksi
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page"
                           href="list.html">Anggota</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card">
            <h1 class="section-title">Tambah Anggota</h1>

            <form id="form-tambah" class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="nama" class="form-label">Nama</label>
                    <input type="text" class="form-control"
                           id="nama" name="nama"
                           maxlength="120" required>
                </div>

                <div class="col-12">
                    <label for="alamat" class="form-label">Alamat</label>
                    <textarea class="form-control"
                              id="alamat" name="alamat"
                              rows="3" required></textarea>
                </div>

                <div class="col-12 col-md-6">
                    <label for="no_hp" class="form-label">No. HP</label>
                    <input type="tel" class="form-control"
                           id="no_hp" name="no_hp"
                           maxlength="30" required>
                </div>

                <div class="col-12 d-flex gap-2">
                    <button type="submit"
                            class="btn btn-submit rounded-pill px-4 text-white fw-bold">
                        Simpan
                    </button>

                    <a href="list.html"
                       class="btn btn-outline-secondary rounded-pill px-4">
                        Kembali
                    </a>
                </div>
            </form>

            <p class="form-feedback text-success fw-semibold mt-3 mb-0"
               role="status" hidden>
                Form valid. Pada Jobsheet 6, data belum disimpan.
            </p>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Yayasan Rumah Quran</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
